<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16794a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kasir Toko</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#f3f6f4}*{box-sizing:border-box}body{margin:0;-webkit-user-select:none;user-select:none}.app{max-width:1100px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#16794a;color:white;border-radius:13px;padding:12px;font-size:22px}.muted{color:#64748b;font-size:13px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-bottom:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button,.btn{border:1px solid #dbe3de;background:white;color:#334155;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.tabs button.active,.primary{background:#16794a!important;color:white!important;border-color:#16794a!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.product{border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}.product:hover{border-color:#26965f}.emoji{font-size:25px;background:#f1f5f3;border-radius:10px;width:43px;height:43px;display:grid;place-items:center;margin-bottom:9px}.price{font-weight:800;color:#16794a;margin:5px 0}.field{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin:4px 0 10px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.grow{flex:1;min-width:0}.hidden{display:none!important}.danger{color:#b91c1c}.small{padding:5px 9px;border:1px solid #dbe3de;border-radius:8px;background:white;cursor:pointer}.total{font-size:24px;font-weight:850;color:#16794a}.cartline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0ee}.cartline:last-child{border:0}.section{display:none}.section.active{display:block}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.modalbox{background:white;border-radius:16px;padding:19px;width:min(420px,100%);max-height:90vh;overflow:auto}.receipt{font:12px/1.5 monospace;white-space:pre-wrap;background:#f8faf9;padding:12px;border-radius:8px}.note{font-size:12px;color:#64748b;margin-top:12px}@media(min-width:760px){.layout{display:grid;grid-template-columns:1.3fr .9fr;gap:14px}}@media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{position:absolute;left:0;top:0;width:58mm;padding:2mm;background:white;color:black;font:10px monospace}}
</style>
</head>
<body><main class="app">
<header class="head"><div class="brand"><div class="logo">▦</div><div><h2 style="margin:0">Kasir Toko</h2><div class="muted" id="shopSubtitle">Sistem Penjualan Toko</div></div></div><button class="btn" id="adminBtn">♙ Admin</button></header>
<div class="between" style="margin-bottom:12px"><div><div class="muted" id="today"></div><b id="heading">Kasir Penjualan</b></div><span style="color:#16794a;font-size:12px">● Aktif</span></div>
<nav class="tabs"><button class="active" data-tab="kasir">▦ Kasir</button><button data-tab="barang">▤ Barang</button><button data-tab="laporan">▥ Laporan</button><button data-tab="pengaturan">⚙ Pengaturan</button></nav>
<section id="kasir" class="section active"><div class="layout"><div><div class="card"><input id="search" class="field" placeholder="Cari nama barang..."></div><div class="between" style="margin:10px 0"><b>Daftar Produk</b><span class="muted" id="productCount"></span></div><div class="grid" id="products"></div></div><div class="card"><div class="between"><b>🛒 Keranjang</b><span class="muted" id="cartCount">0 barang</span></div><div id="cart" style="margin-top:10px"></div><hr style="border:0;border-top:1px solid #e2e8f0"><div class="between muted"><span>Total</span><span id="qtyTotal">0</span></div><div class="between" style="margin-top:8px"><b>Bayar</b><span class="total" id="total">Rp0</span></div><button class="btn primary" id="pay" style="width:100%;margin-top:15px" disabled>Bayar Sekarang →</button></div></div></section>
<section id="barang" class="section"><div class="between"><div><h3 style="margin:0">Kelola Barang</h3></div><button class="btn primary" id="add">＋ Tambah</button></div><div class="card"><input id="manageSearch" class="field" placeholder="Cari barang..."></div><div id="manage"></div></section>
<section id="laporan" class="section"><h3>Laporan</h3><div class="row"><button class="btn primary" id="daily">Harian</button><button class="btn" id="monthly">Bulanan</button></div><div class="card"><input type="date" id="reportDate" class="field"></div><div class="stats" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="stat" style="border:1px solid #e2e8f0;border-radius:12px;padding:13px"><div class="muted">Omzet</div><b id="revenue">Rp0</b></div><div class="stat"><div class="muted">Transaksi</div><b id="transactions">0</b></div></div></section>
<section id="pengaturan" class="section"><h3>Pengaturan</h3><div class="card"><label class="muted">Nama Toko</label><input id="shopName" class="field"><label class="muted">Alamat</label><input id="shopAddress" class="field"><label class="muted">WhatsApp (62...)</label><input id="shopPhone" class="field"><button class="btn primary" id="saveSettings">Simpan</button></div></section>
<p class="note">💡 Data tersimpan di HP. Untuk cetak: pasangkan printer Bluetooth → buka RawBT → pilih RawBT saat mencetak.</p>
</main><div id="modalHost"></div><div id="printArea" class="hidden"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), money=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID'), today=()=>{let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sample=[{id:1,name:'Beras 5 Kg',code:'BR001',buy:65000,sell:72000,stock:20,icon:'🌾'},{id:2,name:'Minyak Goreng',code:'MG001',buy:16000,sell:19000,stock:35,icon:'🫗'},{id:3,name:'Gula Pasir 1 Kg',code:'GP001',buy:14500,sell:17000,stock:30,icon:'🍚'},{id:4,name:'Mi Instan',code:'MI001',buy:2800,sell:3500,stock:80,icon:'🍜'},{id:5,name:'Telur 1 Kg',code:'TL001',buy:26000,sell:30000,stock:15,icon:'🥚'},{id:6,name:'Air Mineral',code:'AM001',buy:3000,sell:4000,stock:40,icon:'💧'}];
let products,sales,cart=[],settings={name:'Toko Hadi',address:'',phone:''},pin='1234',admin=false,mode='daily';
function load(){try{products=JSON.parse(localStorage.kh_products)||sample.map(x=>({...x}));sales=JSON.parse(localStorage.kh_sales)||[];settings={...settings,...JSON.parse(localStorage.kh_settings||'{}')};pin=localStorage.kh_pin||'1234'}catch(e){products=sample.map(x=>({...x}));sales=[]}}
function save(){localStorage.kh_products=JSON.stringify(products);localStorage.kh_sales=JSON.stringify(sales);localStorage.kh_settings=JSON.stringify(settings);localStorage.kh_pin=pin}
function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17251d;color:white;padding:12px 18px;border-radius:10px;z-index:9999';document.body.append(x);setTimeout(()=>x.remove(),2500)}
function modal(html){$('modalHost').innerHTML='<div class="modal" id="modalBg"><div class="modalbox">'+html+'</div></div>';$('modalBg').onclick=e=>{if(e.target.id==='modalBg')close()}}function close(){$('modalHost').innerHTML=''}
function login(done){if(admin){done();return}modal('<h3>🔐 Login Admin</h3><input class="field" id="loginPin" type="password" placeholder="PIN"><div id="loginError" class="danger muted"></div><div class="row"><button class="btn" id="cancel">Batal</button><button class="btn primary grow" id="enter">Masuk</button></div>');$('cancel').onclick=close;$('enter').onclick=()=>{if($('loginPin').value===pin){admin=true;close();done()}else $('loginError').textContent='PIN Salah!'}
$('loginPin').onkeydown=e=>{if(e.key==='Enter')$('enter').click()}}
$('adminBtn').onclick=()=>{if(admin){admin=false;$('adminBtn').textContent='♙ Admin';toast('Keluar')}else login(()=>{ $('adminBtn').textContent='♙ Admin ✓';toast('Login Berhasil!')})};
function tab(t){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{let t=b.dataset.tab;if(t!=='kasir'&&!admin){login(()=>tab(t));return}tab(t)});
function renderProducts(){let q=$('search').value.toLowerCase(),list=products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));$('productCount').textContent=list.length+' Produk';$('products').innerHTML=list.map(p=>`<button class="product" data-add="${p.id}" ${p.stock<=0?'disabled':''}><div class="emoji">${esc(p.icon||'📦')}</div><b>${esc(p.name)}</b><div class="price">${money(p.sell)}</div><div class="muted">Stok: ${p.stock}</div></button>`).join('')||'<p class="muted">Tidak Ditemukan</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add))}
function add(id){let p=products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c?.qty>=p.stock)return toast('Stok Kurang!');if(c)c.qty++;else cart.push({id,qty:1});renderCart()}
function renderCart(){let qty=cart.reduce((a,c)=>a+c.qty,0),total=cart.reduce((a,c)=>a+c.qty*products.find(p=>p.id===c.id).sell,0);$('cartCount').textContent=qty+' Barang';$('qtyTotal').textContent=qty;$('total').textContent=money(total);$('pay').disabled=!qty;$('cart').innerHTML=cart.map(c=>{let p=products.find(x=>x.id===c.id);return `<div class="cartline"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${money(p.sell)}</div></div><button class="small" data-dec="${c.id}">−</button><b>${c.qty}</b><button class="small" data-inc="${c.id}">＋</button><b>${money(p.sell*c.qty)}</b><button class="small danger" data-rem="${c.id}">×</button></div>`}).join('')||'<p class="muted" style="text-align:center;padding:20px">Keranjang Kosong</p>';document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>qtyChange(+b.dataset.dec,-1));document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>qtyChange(+b.dataset.inc,1));document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{cart=cart.filter(c=>c.id!==+b.dataset.rem);renderCart()})}
function qtyChange(id,n){let c=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(n>0&&c.qty>=p.stock)return toast('Stok Kurang!');c.qty+=n;if(c.qty<1)cart=cart.filter(x=>x.id!==id);renderCart()}
$('search').oninput=renderProducts;
$('pay').onclick=()=>{let total=cart.reduce((a,c)=>a+c.qty*products.find(p=>p.id===c.id).sell,0);modal(`<h3>Pembayaran</h3><div class="card"><div class="muted">Total</div><div class="total">${money(total)}</div></div><label class="muted">Uang Bayar</label><input class="field" type="number" id="paid" placeholder="0"><div class="between"><span>Kembalian</span><b id="change">Rp0</b></div><p id="payError" class="danger muted"></p><div class="row" style="margin-top:15px"><button class="btn" id="cancelPay">Batal</button><button class="btn primary grow" id="confirm">Selesaikan</button></div>`);$('paid').oninput=()=>$('change').textContent=money(Math.max(0,Number($('paid').value||0)-total));$('cancelPay').onclick=close;$('confirm').onclick=()=>{let paid=Number($('paid').value);if(!Number.isFinite(paid)||paid<total){$('payError').textContent='Uang Kurang!';return}let items=cart.map(c=>{let p=products.find(x=>x.id===c.id);return{id:p.id,name:p.name,qty:c.qty,price:p.sell,subtotal:p.sell*c.qty}}),s={id:'TRX'+Date.now(),date:new Date().toISOString(),items,total,paid,change:paid-total};items.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);sales.push(s);cart=[];save();close();renderProducts();renderCart();showReceipt(s)}};
function receipt(s){let o=settings.name+'\n'+(settings.address||'')+'\n--------------------------------\nNo: '+s.id+'\n'+new Date(s.date).toLocaleString('id-ID')+'\n--------------------------------\n';s.items.forEach(i=>o+=i.name+'\n'+i.qty+' x '+money(i.price)+' = '+money(i.subtotal)+'\n');return o+'--------------------------------\nTOTAL     '+money(s.total)+'\nBAYAR     '+money(s.paid)+'\nKEMBALI   '+money(s.change)+'\n--------------------------------\nTerima Kasih!\n✅ Berhasil Dicetak!\n'}
function printReceipt(s){const area=$('printArea');area.classList.remove('hidden');area.innerHTML='<pre style="white-space:pre-wrap;margin:0;font-family:monospace;font-size:10px;line-height:1.4">'+esc(receipt(s))+'</pre>';setTimeout(()=>{window.print();toast('👉 Pilih Printer: RawBT');},200);const mq=window.matchMedia('print');mq.onchange=(e)=>{if(!e.matches){setTimeout(()=>area.classList.add('hidden'),300);mq.onchange=null;}};}
function showReceipt(s){modal('<div class="between"><h3>✓ Berhasil</h3><button class="btn" id="x">✕</button></div><pre class="receipt" id="receipt"></pre><div class="row"><button class="btn grow" id="print">▣ Cetak</button><button class="btn primary grow" id="wa">WA</button></div><button class="btn" style="width:100%;margin-top:9px" id="done">Selesai</button>');$('receipt').textContent=receipt(s);$('x').onclick=$('done').onclick=close;$('print').onclick=()=>printReceipt(s);$('wa').onclick=()=>{let phone=settings.phone.replace(/\D/g,'');if(!phone)return toast('Isi Nomor WA Dulu!');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(receipt(s)),'_blank')}}
function renderManage(){let q=$('manageSearch').value.toLowerCase(),list=products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));$('manage').innerHTML=list.map(p=>`<div class="card row"><div class="emoji">${esc(p.icon||'📦')}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted">Stok: ${p.stock}</div><div class="muted">Jual: ${money(p.sell)}</div></div><button class="small" data-edit="${p.id}">✎</button><button class="small danger" data-delete="${p.id}">⌫</button></div>`).join('')||'<p class="muted">Belum Ada Barang</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productForm(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let id=+b.dataset.delete;modal('<h3>Hapus?</h3><div class="row"><button class="btn" id="no">Batal</button><button class="btn primary" id="yes" style="background:#b91c1c!important">Hapus</button></div>');$('no').onclick=close;$('yes').onclick=()=>{products=products.filter(p=>p.id!==id);save();close();renderManage();renderProducts()}})}
$('manageSearch').oninput=renderManage;
function productForm(id){let p=products.find(x=>x.id===id)||{name:'',code:'',buy:'',sell:'',stock:'',icon:'📦'};modal(`<h3>${id?'Edit':'Tambah'} Barang</h3><label class="muted">Nama</label><input class="field" id="pname" value="${esc(p.name)}"><label class="muted">Harga Jual</label><input class="field" id="psell" type="number" value="${p.sell}"><label class="muted">Stok</label><input class="field" id="pstock" type="number" value="${p.stock}"><div class="row"><button class="btn" id="cancelForm">Batal</button><button class="btn primary grow" id="saveProduct">Simpan</button></div>`);$('cancelForm').onclick=close;$('saveProduct').onclick=()=>{let name=$('pname').value.trim(),sell=Number($('psell').value),stock=Number($('pstock').value);if(!name||isNaN(sell)||isNaN(stock))return toast('Lengkapi Data!');let obj={id:id||Date.now(),name,code:p.code||'A'+Date.now(),buy:p.buy||0,sell,stock,icon:p.icon||'📦'};if(id)products=products.map(x=>x.id===id?obj:x);else products.push(obj);save();close();renderManage();renderProducts();toast('Disimpan!')}}
$('add').onclick=()=>productForm();
$('saveSettings').onclick=()=>{settings={name:$('shopName').value.trim()||'Toko',address:$('shopAddress').value.trim(),phone:$('shopPhone').value.trim()};save();toast('Tersimpan!')};
function reportRows(){let d=$('reportDate').value||today();return sales.filter(s=>mode==='daily'?s.date.slice(0,10)===d:s.date.slice(0,7)===d.slice(0,7))}
function renderReport(){let a=reportRows(),rev=a.reduce((n,s)=>n+s.total,0);$('revenue').textContent=money(rev);$('transactions').textContent=a.length}
$('daily').onclick=()=>{mode='daily';$('daily').classList.add('primary');$('monthly').classList.remove('primary')};
$('monthly').onclick=()=>{mode='monthly';$('monthly').classList.add('primary');$('daily').classList.remove('primary')};
$('reportDate').value=today();$('reportDate').onchange=renderReport;
function init(){load();$('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('shopSubtitle').textContent=settings.name;$('shopName').value=settings.name;$('shopAddress').value=settings.address;$('shopPhone').value=settings.phone;renderProducts();renderCart();renderReport()}
init();
})();
</script></body></html>
